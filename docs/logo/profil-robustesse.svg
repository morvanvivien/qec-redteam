<svg xmlns="http://www.w3.org/2000/svg" width="240" height="280" viewBox="0 0 240 280" role="img" aria-labelledby="t d">
  <title id="t">Profil de robustesse QEC</title>
  <desc id="d">Écusson : une grille de qubits dont un est en défaut, entourée d'un anneau de mesure. Mention « QEC, profil de robustesse, v0.1 ».</desc>
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B2A4A"/>
      <stop offset="1" stop-color="#0E1728"/>
    </linearGradient>
  </defs>
  <!-- écusson -->
  <path d="M120 8 L224 44 L224 142 C224 206 178 250 120 272 C62 250 16 206 16 142 L16 44 Z" fill="url(#fond)" stroke="#C9A227" stroke-width="4"/>
  <!-- anneau de mesure -->
  <circle cx="120" cy="102" r="60" fill="none" stroke="#C9A227" stroke-width="2" stroke-dasharray="4 6" opacity="0.9"/>
  <!-- liaisons de la grille 3 x 3 -->
  <g stroke="#6F86B8" stroke-width="3" stroke-linecap="round">
    <line x1="88" y1="70" x2="152" y2="70"/>
    <line x1="88" y1="102" x2="152" y2="102"/>
    <line x1="88" y1="134" x2="152" y2="134"/>
    <line x1="88" y1="70" x2="88" y2="134"/>
    <line x1="120" y1="70" x2="120" y2="134"/>
    <line x1="152" y1="70" x2="152" y2="134"/>
  </g>
  <!-- qubits -->
  <g fill="#E8EEF9">
    <circle cx="88" cy="70" r="7.5"/><circle cx="120" cy="70" r="7.5"/><circle cx="152" cy="70" r="7.5"/>
    <circle cx="88" cy="102" r="7.5"/><circle cx="152" cy="102" r="7.5"/>
    <circle cx="88" cy="134" r="7.5"/><circle cx="120" cy="134" r="7.5"/><circle cx="152" cy="134" r="7.5"/>
  </g>
  <!-- le qubit en défaut, repéré -->
  <circle cx="120" cy="102" r="8.5" fill="#D9534F"/>
  <circle cx="120" cy="102" r="15" fill="none" stroke="#D9534F" stroke-width="2.5"/>
  <!-- mentions -->
  <text x="120" y="192" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="5" fill="#E8EEF9">QEC</text>
  <text x="120" y="211" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1" fill="#E8EEF9">PROFIL DE ROBUSTESSE</text>
  <text x="120" y="231" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="2" fill="#C9A227">v0.1</text>
</svg>
