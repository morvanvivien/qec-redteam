# Independent check of trmue/relay PR 48 (head c3831ec) against the measurements reported in #43.
# This branch is c3831ec plus this file. The scripts come from https://github.com/morvanvivien/qec-redteam
name: verify-pr-48

on:
  push:
    branches: [verify-pr-48]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: minimal
            cmd: |
              python research/relay-bp-priors/repro_crash.py
              python research/relay-bp-priors/repro_half_prior.py
              python research/relay-bp-priors/repro_half_prior.py --min-log-prior-ratio 4e-5
          - part: d5-ancilla
            cmd: python research/relay-bp-priors/measure_effect.py --distance 5 --shots 10000 --seeds 101 102 103 --scenarios "fuite ancilla 1r"
          - part: d5-data
            cmd: python research/relay-bp-priors/measure_effect.py --distance 5 --shots 10000 --seeds 101 102 103 --scenarios "fuite donnée centrale"
          - part: gross-ancilla
            cmd: python research/relay-bp-priors/gross_half_prior.py --p 0.003 --shots 60 --seed 6 --scenario "fuite ancilla"
          - part: gross-data
            cmd: python research/relay-bp-priors/gross_half_prior.py --p 0.003 --shots 60 --seed 7 --scenario "fuite donnée centrale"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/checkout@v4
        with:
          repository: morvanvivien/qec-redteam
          ref: 0acfcbc4ab3da23d35a9184a58705a37c165402d
          path: qec-redteam
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build relay-bp from this branch (release profile) and install the measurement tools
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install -r qec-redteam/requirements.txt beliefmatching==0.2.0 scipy==1.17.1
      - name: Environment
        run: |
          mkdir -p out
          {
            echo "PR head under test: $(git rev-parse HEAD^)"
            echo "qec-redteam: $(git -C qec-redteam rev-parse HEAD)"
            rustc --version
            python --version
            pip list 2>/dev/null | grep -iE '^(relay-bp|stim|sinter|pymatching|beliefmatching|numpy|scipy) '
            python -c "import relay_bp.stim.sinter.check_matrices as m; print('clamp_priors present:', hasattr(m, 'clamp_priors'), m.__file__)"
          } | tee out/environment-${{ matrix.part }}.txt
      - name: Run ${{ matrix.part }}
        working-directory: qec-redteam
        run: |
          ( ${{ matrix.cmd }} ) 2>&1 | tee ../out/results-${{ matrix.part }}.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.part }}
          path: out/
